name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun run preflight
      - run: bun run typecheck
      - run: bun run test:coverage
      - run: bun run build
      - run: bun run smoke:check
      - run: bun run smoke:tui
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: runner.os == 'Windows'
        with:
          name: oec-win32-x64
          path: packages/oec-win32-x64/bin/oec.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: runner.os == 'Linux'
        with:
          name: oec-linux-x64
          path: packages/oec-linux-x64/bin/oec

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: oec-win32-x64
          path: packages/oec-win32-x64/bin
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: oec-linux-x64
          path: packages/oec-linux-x64/bin
      - run: chmod +x packages/oec-linux-x64/bin/oec
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - run: bun run preflight
      - run: bun run pack:check
