name: Publish npm packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run preflight
      - run: bun run typecheck
      - run: bun run test:coverage
      - run: bun run build:windows
      - name: Verify global npm installation
        run: bun run scripts/npm-install-smoke.ts "${{ runner.temp }}"
      - run: bun run smoke:check win32-x64
      - run: bun run smoke:tui
      - uses: actions/upload-artifact@v4
        with:
          name: oec-win32-x64
          path: packages/oec-win32-x64/bin/oec.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run preflight
      - run: bun run typecheck
      - run: bun run test:coverage
      - run: bun run build:linux
      - name: Verify global npm installation
        run: bun run scripts/npm-install-smoke.ts "${{ runner.temp }}"
      - name: Test Bash installer (offline)
        run: |
          bash tests/scripts/install.test.sh
          if command -v shellcheck >/dev/null; then
            shellcheck install.sh tests/scripts/install.test.sh
          fi
      - run: bun run smoke:check linux-x64
      - run: bun run smoke:tui
      - uses: actions/upload-artifact@v4
        with:
          name: oec-linux-x64
          path: packages/oec-linux-x64/bin/oec

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: oec-win32-x64
          path: windows
      - uses: actions/download-artifact@v4
        with:
          name: oec-linux-x64
          path: linux
      - name: Publish release binaries and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir assets
          cp windows/oec.exe assets/oec-win32-x64.exe
          cp linux/oec assets/oec-linux-x64
          cd assets
          sha256sum oec-linux-x64 oec-win32-x64.exe > SHA256SUMS
          prerelease=false
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=true; fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes
          fi
          gh release upload "$RELEASE_TAG" oec-linux-x64 oec-win32-x64.exe SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$prerelease"

  publish:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: oec-win32-x64
          path: packages/oec-win32-x64/bin
      - uses: actions/download-artifact@v4
        with:
          name: oec-linux-x64
          path: packages/oec-linux-x64/bin
      - run: chmod +x packages/oec-linux-x64/bin/oec
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun run preflight
      - run: bun run pack:check
      - run: npm publish --access public
        working-directory: packages/oec-win32-x64
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish --access public
        working-directory: packages/oec-linux-x64
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
