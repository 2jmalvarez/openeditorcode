name: Publish npm packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    uses: ./.github/workflows/security.yml

  build-windows:
    needs: security
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun run preflight
      - run: bun run typecheck
      - run: bun run test:coverage
      - name: Test PowerShell installer (Windows PowerShell 5.1, offline)
        shell: powershell
        run: ./tests/scripts/install.test.ps1
      - name: Test PowerShell installer (PowerShell 7, offline)
        shell: pwsh
        run: ./tests/scripts/install.test.ps1
      - run: bun run build:windows
      - name: Verify global npm installation
        run: bun run scripts/npm-install-smoke.ts "${{ runner.temp }}"
      - run: bun run smoke:check win32-x64
      - run: bun run smoke:tui
      - name: Verify compiled image preview at usable size
        run: bun run scripts/image-smoke.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oec-win32-x64
          path: packages/oec-win32-x64/bin/oec.exe

  build-linux:
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun run preflight
      - run: bun run typecheck
      - run: bun run test:coverage
      - run: bun run build:linux
      - name: Verify global npm installation
        run: bun run scripts/npm-install-smoke.ts "${{ runner.temp }}"
      - name: Test Bash installer (offline)
        run: |
          bash tests/scripts/install.test.sh
          if command -v shellcheck >/dev/null; then
            shellcheck install.sh tests/scripts/install.test.sh
          fi
      - run: bun run smoke:check linux-x64
      - run: bun run smoke:tui
      - name: Verify compiled image preview at usable size
        run: bun run scripts/image-smoke.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oec-linux-x64
          path: packages/oec-linux-x64/bin/oec

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: oec-win32-x64
          path: windows
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: oec-linux-x64
          path: linux
      - name: Publish release binaries and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir assets
          cp windows/oec.exe assets/oec-win32-x64.exe
          cp linux/oec assets/oec-linux-x64
          cd assets
          sha256sum oec-linux-x64 oec-win32-x64.exe > SHA256SUMS
          prerelease=false
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=true; fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes
          fi
          gh release upload "$RELEASE_TAG" oec-linux-x64 oec-win32-x64.exe SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$prerelease"

  publish:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: oec-win32-x64
          path: packages/oec-win32-x64/bin
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: oec-linux-x64
          path: packages/oec-linux-x64/bin
      - run: chmod +x packages/oec-linux-x64/bin/oec
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - run: bun run preflight
      - run: bun run pack:check
      - name: Verify Linux package executable mode
        run: |
          archive="$(cd packages/oec-linux-x64 && npm pack --pack-destination "$RUNNER_TEMP")"
          tar -tvzf "$RUNNER_TEMP/$archive" | grep -Eq '^-rwxr-xr-x[[:space:]].*[[:space:]]package/bin/oec$'
      - run: npm publish --access public
        working-directory: packages/oec-win32-x64
      - run: npm publish --access public
        working-directory: packages/oec-linux-x64
      - run: npm publish
