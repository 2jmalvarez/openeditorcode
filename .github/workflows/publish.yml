name: Publish npm packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build:windows
      - uses: actions/upload-artifact@v4
        with:
          name: oec-win32-x64
          path: packages/oec-win32-x64/bin/oec.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build:linux
      - uses: actions/upload-artifact@v4
        with:
          name: oec-linux-x64
          path: packages/oec-linux-x64/bin/oec

  publish:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: oec-win32-x64
          path: packages/oec-win32-x64/bin
      - uses: actions/download-artifact@v4
        with:
          name: oec-linux-x64
          path: packages/oec-linux-x64/bin
      - run: chmod +x packages/oec-linux-x64/bin/oec
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm pack --dry-run
        working-directory: packages/oec-win32-x64
      - run: npm pack --dry-run
        working-directory: packages/oec-linux-x64
      - run: npm pack --dry-run
      - run: npm publish --access public
        working-directory: packages/oec-win32-x64
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish --access public
        working-directory: packages/oec-linux-x64
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
