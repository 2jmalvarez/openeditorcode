name: Publish OpenCode editor plugin

on:
  push:
    tags: ["opencode-editor-v*"]

permissions:
  contents: read

concurrency:
  group: publish-opencode-editor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  security:
    uses: ./.github/workflows/security.yml

  verify:
    needs: security
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        opencode: ["2.0.26", "2.0.27", "2.1.0", "2.1.1"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun run plugin:preflight
      - run: bun run typecheck
      - run: bun run test
      - run: bun run plugin:test
      - run: bun run plugin:build
      - run: bun run plugin:pack:check
      - name: Acquire and test isolated OpenCode host
        shell: bash
        env:
          HOST_VERSION: ${{ matrix.opencode }}
        run: |
          set -euo pipefail
          executable="$(bun run plugins/opencode-editor/scripts/host-executable.ts "$HOST_VERSION" "$RUNNER_TEMP/host")"
          archive="$(bun -e 'const p = await Bun.file("plugins/opencode-editor/dist/release/pack.json").json(); console.log("plugins/opencode-editor/dist/release/" + p.filename)')"
          bun run plugin:smoke "$executable" "$archive"
          bun run plugin:smoke "$executable" "$archive" --auto-root
          bun run plugins/opencode-editor/scripts/smoke-sidebar.ts "$executable" "$archive"
          bun run plugins/opencode-editor/scripts/smoke-access.ts "$executable" "$archive"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.os == 'ubuntu-latest' && matrix.opencode == '2.0.27'
        with:
          name: opencode-editor-package
          path: plugins/opencode-editor/dist/release/
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run plugin:preflight
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: opencode-editor-package
          path: plugins/opencode-editor/dist/release
      - name: Check existing version and artifact integrity
        id: registry
        run: bun run plugin:registry before plugins/opencode-editor/dist/release/pack.json
      - name: Publish only the verified plugin tarball using OIDC
        if: steps.registry.outputs.exists != 'true'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          archive="$(bun -e 'const p = await Bun.file("plugins/opencode-editor/dist/release/pack.json").json(); console.log("plugins/opencode-editor/dist/release/" + p.filename)')"
          dist_tag="$(bun -e 'import { validateTag } from "./plugins/opencode-editor/scripts/release.ts"; const p = await Bun.file("plugins/opencode-editor/package.json").json(); console.log(validateTag(process.env.RELEASE_TAG, p.version))')"
          npm publish "$archive" --access public --provenance --tag "$dist_tag" --registry https://registry.npmjs.org --ignore-scripts
      - name: Verify published registry artifact and provenance
        run: bun run plugin:registry after plugins/opencode-editor/dist/release/pack.json
      - name: Test actual installation by package name
        run: |
          set -euo pipefail
          executable="$(bun run plugins/opencode-editor/scripts/host-executable.ts 2.1.1 "$RUNNER_TEMP/published-host")"
          package="$(bun -e 'const p = await Bun.file("plugins/opencode-editor/package.json").json(); console.log(p.name + "@" + p.version)')"
          bun run plugin:smoke "$executable" "$package"
          bun run plugin:smoke "$executable" "$package" --auto-root
          bun run plugins/opencode-editor/scripts/smoke-sidebar.ts "$executable" "$package"
          bun run plugins/opencode-editor/scripts/smoke-access.ts "$executable" "$package"
