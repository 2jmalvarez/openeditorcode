name: Security

on:
  push:
    branches: [main]
    tags: ["v*", "opencode-editor-v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned secret scanner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          gh release download v8.30.1 --repo gitleaks/gitleaks --pattern 'gitleaks_8.30.1_linux_x64.tar.gz' --pattern 'gitleaks_8.30.1_checksums.txt'
          grep ' gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum --check --strict
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: Verify scanner detects a synthetic secret
        run: |
          set -euo pipefail
          set +e
          printf 'github_token = "%s%s"\n' 'ghp_' 'aB3dE5fG7hI9jK1lM2nO4pQ6rS8tU0vW2xY4' | gitleaks stdin --redact --no-banner --exit-code 23
          status=$?
          set -e
          test "$status" -eq 23
      - name: Scan complete reachable history and working tree
        run: |
          gitleaks git --log-opts="--all --full-history" --redact --no-banner
          gitleaks dir --redact --no-banner
